packages:
  - "apps/*"
  - "packages/*"
  - "packages/addons/*"

# Patch-level security floor for a transitive dependency of next.
overrides:
  postcss: "^8.5.23"

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  workerd@1.20250718.0: true
  workerd@1.20261103.1: true
  workerd@1.20261110.1: true
