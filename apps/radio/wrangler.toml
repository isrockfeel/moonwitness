name = "moonwitness-radio"
compatibility_date = "2024-12-01"
pages_build_output_dir = "dist"

[build]
command = "pnpm run build"

[env]
NODE_ENV = "production"

[[durable_objects.bindings]]
name = "RADIO_ROOM"
class_name = "RadioRoom"

[[d1_databases]]
binding = "DB"
database_name = "moonwitness-radio"
database_id = "xxx"

[[kv_namespaces]]
binding = "CACHE"
id = "xxx"

[observability]
enabled = true

[assets]
directory = "dist"
binding = "RADIO_ASSETS"