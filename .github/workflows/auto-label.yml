name: Auto Label & Assign
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    name: Auto Label
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto Label
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

  assign:
    name: Auto Assign
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto Assign
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Simple YAML parser for our specific format
            function parseYAML(content) {
              const result = {};
              const lines = content.split('\n');
              let currentKey = null;
              let currentArray = null;
              
              for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#')) continue;
                
                // Check for key: value or key:
                const keyMatch = trimmed.match(/^([a-zA-Z0-9_/-]+):\s*(.*)$/);
                if (keyMatch) {
                  const key = keyMatch[1];
                  const value = keyMatch[2].trim();
                  
                  if (value.startsWith('[') || value.startsWith('{')) {
                    // Skip complex values for now
                    continue;
                  }
                  
                  if (value === '') {
                    // This is a key with array value (next lines)
                    currentKey = key;
                    result[currentKey] = [];
                    currentArray = result[currentKey];
                  } else {
                    // Simple key: value
                    result[key] = value.replace(/^["']|["']$/g, '');
                    currentKey = null;
                    currentArray = null;
                  }
                } else if (trimmed.startsWith('- ')) {
                  // Array item
                  if (currentKey && Array.isArray(result[currentKey])) {
                    const item = trimmed.substring(2).trim().replace(/^["']|["']$/g, '');
                    result[currentKey].push(item);
                  }
                }
              }
              return result;
            }
            
            const configContent = fs.readFileSync('.github/assigner.yml', 'utf8');
            const config = parseYAML(configContent);
            
            // Get PR files
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            // Collect all matching assignees
            const assignees = new Set();
            
            // Add default assignees
            if (config.default) {
              config.default.forEach(a => assignees.add(a));
            }
            
            // Check each file against patterns
            for (const file of files.data) {
              const filename = file.filename;
              for (const [pattern, assigneesList] of Object.entries(config)) {
                if (pattern === 'default') continue;
                
                // Convert glob pattern to regex
                const regexPattern = pattern
                  .replace(/\./g, '\\.')
                  .replace(/\*\*/g, '.*')
                  .replace(/\*/g, '[^/]*');
                
                try {
                  const regex = new RegExp(`^${regexPattern}$`);
                  if (regex.test(filename)) {
                    if (Array.isArray(config[pattern])) {
                      config[pattern].forEach(a => assignees.add(a));
                    }
                  }
                } catch (e) {
                  // Invalid regex, skip
                }
              }
            }
            
            // Assign reviewers
            if (assignees.size > 0) {
              const assigneesList = Array.from(assignees);
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                reviewers: Array.from(assignees)
              });
              console.log(`Assigned reviewers: ${Array.from(assignees).join(', ')}`);
            } else {
              console.log('No matching assignees found');
            }