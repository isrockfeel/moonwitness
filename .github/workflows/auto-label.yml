name: Auto Label & Assign
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    name: Auto Label
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto Label
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

  assign:
    name: Auto Assign
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto Assign
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Simple YAML parser for our specific format
            function parseYAML(content) {
              const result = {};
              const lines = content.split('\n');
              let currentKey = null;
              let currentArray = null;
              
              for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#')) continue;
                
                // Check for key: value or key:
                const keyMatch = trimmed.match(/^([a-zA-Z0-9_/-]+):\s*(.*)$/);
                if (keyMatch) {
                  const key = keyMatch[1];
                  const value = keyMatch[2].trim();
                  
                  if (value.startsWith('[') || value.startsWith('{')) {
                    // Skip complex values for now
                    continue;
                  }
                  
                  if (value === '') {
                    // This is a key with array value (next lines)
                    currentKey = key;
                    result[currentKey] = [];
                    currentArray = result[currentKey];
                  } else {
                    // Simple key: value
                    result[key] = value.replace(/^["']|["']$/g, '');
                    currentKey = null;
                    currentArray = null;
                  }
                } else if (trimmed.startsWith('- ')) {
                  // Array item
                  if (currentKey && Array.isArray(result[currentKey])) {
                    const item = trimmed.substring(2).trim().replace(/^["']|["']$/g, '');
                    result[currentKey].push(item);
                  }
                }
              }
              return result;
            }
            
            const configContent = fs.readFileSync('.github/assigner.yml', 'utf8');
            const config = parseYAML(configContent);
            
            // Get PR files
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            // Collect all matching assignees
            const assignees = new Set();
            
            // Filter out PR author (can't request review from author)
            const prAuthor = context.payload.pull_request.user.login;
            const filteredAssignees = Array.from(assignees).filter(a => a !== prAuthor);
            
            // Assign reviewers
            if (filteredAssignees.length > 0) {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                reviewers: filteredAssignees
              });
              console.log(`Assigned reviewers: ${filteredAssignees.join(', ')}`);
            } else {
              console.log('No matching assignees found (after filtering PR author)');
            }