name: Visual Regression (Percy)
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  visual-regression:
    name: Visual Regression (Percy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: ./apps/web
        run: pnpm build

      - name: Report Percy not configured
        if: env.PERCY_TOKEN == ''
        run: echo "::notice::PERCY_TOKEN is not configured; visual comparison was skipped"

      - name: Run Percy visual regression
        if: env.PERCY_TOKEN != ''
        uses: percy/cli-action@v1
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        with:
          command: pnpm exec percy exec -- pnpm exec playwright test --reporter=list
          working-directory: ./apps/web

      - name: Upload Percy artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: percy-report
          path: .percy
          retention-days: 30
