name: Promote dev to main

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for promotion (recorded in the PR body)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  promote:
    name: Open promotion pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create or reuse promotion pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ inputs.reason }}
        run: |
          existing=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "pr_number=$existing" >> "$GITHUB_OUTPUT"
            echo "Reusing existing promotion PR #$existing"
          else
            body="Automated promotion of \`dev\` to \`main\`.

          Reason: ${REASON:-none given}

          CI on \`dev\` must be green before auto-merge proceeds. This PR is created with auto-merge enabled."
            gh pr create --base main --head dev --title "chore(release): promote dev to main" --body "$body" --draft=false
            number=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
            echo "pr_number=$number" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pr_number }}"

      - name: Report
        run: |
          echo "Promotion PR #${{ steps.pr.outputs.pr_number }} created with auto-merge enabled."
          echo "It will merge automatically once required checks pass."
