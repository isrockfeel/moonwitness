name: Infracost
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  infracost:
    name: Infracost PR Cost Estimation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost diff
        uses: infracost/actions/setup@v3
        with:
          path: .
          percentage-threshold: 5%
          show-skipped: true

      - name: Post Infracost comment
        if: github.event_name == 'pull_request'
        uses: infracost/actions@v3
        with:
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          behavior: "post-comment"
          comment-behavior: "update"
