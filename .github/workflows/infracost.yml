name: Infracost
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  infracost:
    name: Infracost PR Cost Estimation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Infracost
        uses: infracost/actions/setup@v2
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost diff
        run: |
          infracost diff --path=. --percentage-threshold=5% --show-skipped --format=json > infracost.json

      - name: Post Infracost comment
        if: github.event_name == 'pull_request' && env.INFRACOST_API_KEY != ''
        run: |
          infracost comment github --path=. --repo=$GITHUB_REPOSITORY --github-token=${{ secrets.GITHUB_TOKEN }} --pr=${{ github.event.pull_request.number }} --behavior=update --comment-behavior=update
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
