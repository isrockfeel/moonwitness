name: PR Size Guard
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  size-check:
    name: PR Size Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR files
        id: files
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            })
            return files.data

      - name: Calculate PR size
        id: size
        run: |
          const files = ${{ toJson(steps.files.outputs.result) }};
          let total = 0;
          for (const file of files) {
            total += (file.additions || 0) + (file.deletions || 0);
          }
          console.log(`Total changes: ${total}`);
          echo "total_changes=${total}" >> $GITHUB_OUTPUT

      - name: Check size limits
        run: |
          TOTAL="${{ steps.size.outputs.total_changes }}"
          echo "Total changes: $TOTAL"
          
          # Warn if > 400 lines
          if [ "$TOTAL" -gt 400 ]; then
            echo "::warning::PR is large (> 400 lines changed). Consider splitting into smaller PRs."
          fi
          
          # Fail if > 1200 lines (increased threshold for feature PRs)
          if [ "$TOTAL" -gt 1200 ]; then
            echo "::error::PR is too large (> 1200 lines). Please split into smaller PRs."
            exit 1
          fi

      - name: Post size comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const total = parseInt('${{ steps.size.outputs.total_changes }}') || 0;
            const prNumber = context.payload.pull_request.number;
            
            let message = `## 📏 PR Size Report\n\n`;
            message += `**Total changes:** ${total} lines (additions + deletions)\n\n`;
            
            if (total > 1200) {
              message += `❌ **Too large** (> 1200 lines). Please split into smaller PRs.\n`;
            } else if (total > 400) {
              message += `⚠️ **Large PR** (> 400 lines). Consider splitting.\n`;
            } else if (total > 200) {
              message += `ℹ️ **Medium PR** (${total} lines). Good size.\n`;
            } else {
              message += `✅ **Small PR** (${total} lines). Great!\n`;
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: message
            });