name: Lighthouse CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: ./apps/web
        run: pnpm build

      - name: Run Lighthouse CI
        working-directory: ./apps/web
        run: pnpm exec lhci autorun --config=lighthouserc.json

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 30

  comment:
    name: Post Lighthouse Results
    needs: lighthouse
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Download Lighthouse report
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci

      - name: Post Lighthouse results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const files = fs.readdirSync('.lighthouseci');
            const reportFile = files.find(f => /^lhr-.*\.json$/.test(f));

            if (!reportFile) throw new Error('Lighthouse report was not found in the artifact');
            const report = JSON.parse(fs.readFileSync(path.join('.lighthouseci', reportFile), 'utf8'));
            const lhr = report.lhr || report;

            const metrics = {
              'Performance': lhr.categories.performance.score * 100,
              'Accessibility': lhr.categories.accessibility.score * 100,
              'Best Practices': lhr.categories['best-practices'].score * 100,
              'SEO': lhr.categories.seo.score * 100,
              'PWA': lhr.categories.pwa ? lhr.categories.pwa.score * 100 : 'N/A',
            };

            let message = '## 🏎️ Lighthouse CI Results\n\n';
            Object.entries(metrics).forEach(([key, value]) => {
              const emoji = typeof value === 'number' && value >= 90 ? '✅' : (typeof value === 'number' && value >= 50 ? '⚠️' : '❌');
              message += `${emoji} **${key}:** ${typeof value === 'number' ? value.toFixed(1) + '%' : value}\n`;
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: message,
            });
