name: Bundle Size Budget
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: ./apps/web
        run: pnpm build

      - name: Check bundle size
        id: bundle-size
        run: |
          # Check .next build output for bundle sizes
          BUDGET_KB=200  # 200KB gzipped budget for main bundle
          MAIN_BUNDLE=$(find .next -name "*.js" -path "*/pages/*" | head -1)
          
          if [ -z "$MAIN_BUNDLE" ]; then
            echo "No main bundle found"
            exit 1
          fi
          
          SIZE_KB=$(gzip -c "$MAIN_BUNDLE" | wc -c | awk '{print int($1/1024)}')
          echo "Main bundle size: ${SIZE_KB}KB (gzipped)"
          
          if [ "$SIZE_KB" -gt 200 ]; then
            echo "::warning::Bundle size ${SIZE_KB}KB exceeds budget of 200KB"
          fi
          
          echo "bundle_size_kb=${SIZE_KB}" >> $GITHUB_OUTPUT

      - name: Comment bundle size
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const size = parseInt('${{ steps.bundle-size.outputs.bundle_size_kb }}') || 0;
            const prNumber = context.payload.pull_request.number;
            
            let message = `## 📦 Bundle Size Report\n\n`;
            message += `**Main bundle (gzipped):** ${size}KB\n\n`;
            
            if (size > 200) {
              message += `❌ **Over budget** (> 200KB). Consider code splitting or dynamic imports.\n`;
            } else if (size > 150) {
              message += `⚠️ **Approaching budget** (> 150KB). Monitor closely.\n`;
            } else {
              message += `✅ **Within budget** (< 200KB). Good!\n`;
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: message
            });