name: API Contract Testing (Pact)
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  pact-provider:
    name: Pact Provider Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        working-directory: ./apps/api
        run: pnpm build

      - name: Start API server
        working-directory: ./apps/api
        run: pnpm start &
        env:
          PORT: 3002

      - name: Wait for API
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:3002/health && break
            sleep 1
          done

      - name: Run Pact Verification
        uses: pact-foundation/pact-verifier-action@v1
        with:
          provider-base-url: http://localhost:3002
          pact-broker-url: ${{ secrets.PACT_BROKER_URL }}
          provider-version: ${{ github.sha }}
          publish-verification-results: true

  pact-consumer:
    name: Pact Consumer Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Pact consumer tests
        working-directory: ./apps/web
        run: pnpm test:pact
