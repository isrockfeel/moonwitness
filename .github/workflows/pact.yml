name: API Contract Testing (Pact)
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pact-consumer:
    name: Pact Consumer Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Pact consumer tests
        working-directory: ./apps/web
        run: pnpm test:pact

      - name: Upload Pact contracts
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: apps/web/pacts/*.json
          if-no-files-found: error
          retention-days: 7

  pact-provider:
    name: Pact Provider Verification
    needs: pact-consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Pact contracts
        uses: actions/download-artifact@v4
        with:
          name: pact-contracts
          path: apps/web/pacts

      - name: Build API
        working-directory: ./apps/api
        run: pnpm build

      - name: Start seeded API
        working-directory: ./apps/api
        run: |
          nohup pnpm start > "$RUNNER_TEMP/moonwitness-api.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/moonwitness-api.pid"
        env:
          DATABASE_URL: ./pact-provider.db
          HOST: 127.0.0.1
          PORT: 3002
          SEED: "1"

      - name: Wait for API readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3002/api/v1/readyz; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/moonwitness-api.log"
          exit 1

      - name: Verify Pact contracts
        working-directory: ./apps/api
        run: pnpm verify:pact
        env:
          PACT_PROVIDER_URL: http://127.0.0.1:3002
