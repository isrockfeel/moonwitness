name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Enable auto-merge on the release pull request
        if: steps.release.outputs.pr != '' || steps.release.outputs.prs != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number="${{ steps.release.outputs.pr }}"
          if [ -z "$pr_number" ]; then
            pr_number=$(echo '${{ steps.release.outputs.prs }}' | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[0]["number"] if d else "")' 2>/dev/null || true)
          fi
          if [ -n "$pr_number" ]; then
            echo "Enabling auto-merge on PR #$pr_number"
            gh pr merge --auto --squash "$pr_number" || true
          else
            echo "No release PR was created or updated."
          fi

      - name: Report release outcome
        if: always()
        env:
          RELEASES_CREATED: ${{ steps.release.outputs.releases_created }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ "$RELEASES_CREATED" = "true" ]; then
            echo "Release created: $TAG_NAME"
          else
            echo "No release created on this push (release PR updated or no releasable commits)."
          fi
