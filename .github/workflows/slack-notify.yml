name: Slack Notifications
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

jobs:
  notify:
    name: Notify Slack
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Determine status
        id: status
        run: |
          conclusion="${{ github.event.workflow_run.conclusion || 'manual' }}"
          if [ "$conclusion" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=:white_check_mark:" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          elif [ "$conclusion" = "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=:x:" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          else
            echo "status=$conclusion" >> $GITHUB_OUTPUT
            echo "emoji=:warning:" >> $GITHUB_OUTPUT
            echo "color=warning" >> $GITHUB_OUTPUT
          fi

      - name: Post to Slack
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ steps.status.outputs.status }}
          EMOJI: ${{ steps.status.outputs.emoji }}
          COLOR: ${{ steps.status.outputs.color }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.workflow_name || 'Manual dispatch' }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          REPOSITORY: ${{ github.repository }}
        run: |
          payload=$(jq -n \
            --arg color "$COLOR" \
            --arg title "$EMOJI CI $STATUS" \
            --arg url "$RUN_URL" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg branch "$BRANCH" \
            --arg commit "$COMMIT_SHA" \
            --arg repository "$REPOSITORY" \
            '{attachments:[{color:$color,title:$title,title_link:$url,fields:[
              {title:"Workflow",value:$workflow,short:true},
              {title:"Branch",value:$branch,short:true},
              {title:"Commit",value:$commit,short:true}
            ],footer:$repository,ts:(now|floor)}]}')
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --max-time 15 \
            -H 'Content-type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
