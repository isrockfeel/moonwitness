version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    groups:
      dev-dependencies:
        patterns:
          - "*"
        dependency-type: "development"
      production:
        patterns:
          - "*"
        dependency-type: "production"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "automerge"
    assignees:
      - "The-Batteries"
    reviewers:
      - "The-Batteries"
